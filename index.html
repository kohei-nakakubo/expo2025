<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPO 2025 AIパビリオンレコメンダー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <p class="site-title">AIアテンダーがご案内</p>
            <h1>EXPO 2025 パビリオン診断</h1>
            <p class="sub-title">- あなただけの万博ベスト３を見つけよう -</p>
        </header>

        <main id="main-content">
            <section id="start-container">
                <p class="description">
                    まいど！大阪・関西万博へ。<br>
                    10の簡単な質問にお答えいただくだけで、<br>AIアテンダーが数あるパビリオンの中から、<br>あなた様が最も楽しめるベスト３を厳選してご提案します。
                </p>
                <button id="start-btn">診断をはじめる</button>
            </section>

            <section id="quiz-container" class="hidden">
                <p class="question-number" id="question-number"></p>
                <h2 id="question-text"></h2>
                <div id="choices-area">
                    </div>
            </section>

            <section id="result-container" class="hidden">
                <p class="result-lead">AIアテンダーによる診断が完了しました</p>
                <h2 id="result-title">あなたへのおすすめパビリオン ベスト３</h2>
                
                <div class="result-box score-box">
                    <h3 class="box-title"><span class="icon">📊</span> あなたの興味関心グラフ</h3>
                    <div class="score-wrapper">
                        <div class="chart-wrapper">
                            <canvas id="expo-chart"></canvas>
                        </div>
                    </div>
                </div>

                <div id="recommendation-list">
                    </div>


                <div class="share-area">
                    <a id="share-button" href="#" target="_blank" class="share-button">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><g><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></g></svg>
                        結果をXでシェアする
                    </a>
                    <button id="retry-btn">もう一度診断する</button>
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2025 The Japan Association for the 2025 World Exposition</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
